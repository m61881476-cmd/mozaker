<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>مذاكِر — مقفول مؤقتًا</title>
<link rel="icon" href="favicon.ico">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f2f2f7; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f7; } .card { background: #1c1c1e !important; } p { color: #aeaeb2 !important; } }
  .card { background: #fff; border-radius: 22px; padding: 32px 26px; max-width: 360px; margin: 20px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  img { width: 84px; image-rendering: pixelated; }
  h1 { font-size: 22px; margin: 14px 0 8px; }
  p { color: #6e6e73; line-height: 1.8; margin: 0; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="icons/char.png" alt="">
    <h1>مذاكِر مقفول مؤقتًا 🔒</h1>
    <p>بنجهّز تحديث مهم، وهنرجع قريب إن شاء الله.<br>بياناتك ومذاكرتك محفوظة على جهازك.</p>
  </div>
</body>
</html>
